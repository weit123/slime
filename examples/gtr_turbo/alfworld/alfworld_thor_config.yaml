# ALFWorld configuration for AlfredThorEnv (visual environment with ai2thor 5.0)
# This file is loaded by env_worker.py via config.yaml -> alfworld_config_file

env:
  thor:
    screen_height: 300
    screen_width: 300
    smooth_nav: False
    save_frames_to_disk: False
    save_frames_path: "/tmp/alfworld_frames"
  task_types: [1, 2, 3, 4, 5, 6]
  goal_desc_human_anns_prob: 0.0

controller:
  type: "oracle"
  load_receps: True
  debug: False

general:
  training_method: "dagger"

dagger:
  training:
    max_nb_steps_per_episode: 50

dataset:
  data_path: "$ALFWORLD_DATA/json_2.1.1/train"
  eval_id_data_path: "$ALFWORLD_DATA/json_2.1.1/valid_seen"
  eval_ood_data_path: "$ALFWORLD_DATA/json_2.1.1/valid_unseen"
  num_train_games: -1
  num_eval_games: -1

mask_rcnn:
  pretrained_model_path: ""
